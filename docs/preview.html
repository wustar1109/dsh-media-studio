<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-media-studio · 面板预览</title>
<link rel="stylesheet" href="../src/client/styles.css">
<style>
  :root{
    --dsw-alias-bg-base:#ffffff;
    --dsw-alias-bg-layer-1:#f7f7f9;
    --dsw-alias-bg-layer-2:#eeeef2;
    --dsw-alias-label-primary:#1d1d22;
    --dsw-alias-label-secondary:#6c6f78;
    --dsw-alias-border-l3:#e2e2e8;
    --dsw-alias-border-l2:#cfcfd8;
    --dsw-alias-state-business-primary:#6d5efc;
    --dsw-alias-state-error-primary:#c0453f;
    --dsw-alias-state-success-primary:#3f8f5f;
    --dsh-content-font-size:14px;
  }
  html,body{height:100%}
  body{margin:0;background:var(--dsw-alias-bg-base);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--dsw-alias-label-primary)}
  .mock{display:flex;height:100vh;min-height:760px}
  .rail{width:58px;background:var(--dsw-alias-bg-layer-1);border-right:1px solid var(--dsw-alias-border-l3);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;flex-shrink:0}
  .rail-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#7b6cff,#4a3ed6);display:grid;place-items:center;color:#fff;margin-bottom:8px}
  .rail-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#9a9da8}
  .rail-btn.on{background:#f0efff;color:#5b4be0}
  .rail-dot{width:5px;height:5px;border-radius:50%;background:#ddd;margin-top:4px}
  .panel{flex:1;min-width:0;display:flex;flex-direction:column}
  .badge-live{font-size:11px;color:#6d5efc;background:#f0eeff;border-radius:99px;padding:3px 8px}
  .art{width:100%;height:100%;display:block}
  .mock-note{position:fixed;right:16px;bottom:12px;font-size:11px;color:#9a9da8}
</style>
</head>
<body>
<div class="mock">
  <!-- fake DSH left rail, only for context -->
  <aside class="rail">
    <div class="rail-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l8-4 8 4-8 4-8-4Z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg>
    </div>
    <div class="rail-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/></svg></div>
    <div class="rail-btn on"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 5-9 5-9-5 9-5Z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg></div>
    <div class="rail-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
    <div class="rail-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
    <div class="rail-dot"></div>
  </aside>

  <main class="panel">
    <div class="ms-root">
      <header class="ms-header">
        <div class="ms-brand">
          <span class="ms-brand-mark">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5 9-5Z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
          </span>
          <div class="ms-brand-text">
            <strong>媒体工作台</strong>
            <span>4 个通道就绪 · 1.2 GB 素材</span>
          </div>
        </div>
        <div class="ms-header-meta">
          <span class="ms-live"><span class="ms-spinner" style="width:11px;height:11px"></span>1 个任务进行中</span>
          <button class="ms-icon-btn" aria-label="刷新">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          </button>
        </div>
      </header>

      <nav class="ms-tabs">
        <button class="ms-tab on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7L12 3Z"/></svg><span>创作</span></button>
        <button class="ms-tab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg><span>任务</span><em>1</em></button>
        <button class="ms-tab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg><span>素材库</span></button>
        <button class="ms-tab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8ZM12 17v4"/></svg><span>通道</span></button>
      </nav>

      <div class="ms-body">
        <div class="ms-create">
          <div class="ms-compose">
            <div class="ms-mode-row">
              <div class="ms-seg" role="tablist">
                <button class="on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span>图像</span></button>
                <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4"/></svg><span>视频</span></button>
                <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l9 5-9 5-9-5 9-5Z"/><path d="M3 12l9 5 9-5"/></svg><span>分镜</span></button>
                <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8ZM12 17v4"/></svg><span>ComfyUI</span></button>
              </div>
              <span class="ms-inline-status"><span class="ms-dot on"></span>OpenAI（环境变量）</span>
            </div>

            <label class="ms-field">
              <span class="ms-field-label">画面描述</span>
              <textarea class="ms-textarea" rows="5">雨夜霓虹街头的一只赛博朋克猫，电影感光线，浅景深，35mm，背景有漂浮的全息广告牌</textarea>
            </label>

            <label class="ms-field">
              <span class="ms-field-label">负面提示词</span>
              <input class="ms-input" value="low quality, watermark, text">
            </label>

            <div class="ms-grid-2">
              <label class="ms-field"><span class="ms-field-label">通道</span>
                <select class="ms-select"><option>OpenAI</option><option>Google Gemini / Veo</option><option>火山方舟 Seedream</option></select>
              </label>
              <label class="ms-field"><span class="ms-field-label">模型</span>
                <input class="ms-input" value="gpt-image-1">
              </label>
            </div>

            <div class="ms-grid-3">
              <label class="ms-field"><span class="ms-field-label">张数</span><input class="ms-input" value="4"></label>
              <label class="ms-field"><span class="ms-field-label">尺寸</span><select class="ms-select"><option>按比例</option><option>1024x1024</option><option>1536x864</option></select></label>
              <label class="ms-field"><span class="ms-field-label">比例</span><select class="ms-select"><option>16:9</option><option>1:1</option><option>9:16</option></select></label>
            </div>

            <label class="ms-field">
              <span class="ms-field-label">质量 <span class="ms-hint">OpenAI 通道支持 low / medium / high</span></span>
              <input class="ms-input" value="high">
            </label>

            <div class="ms-refs">
              <div class="ms-refs-head">
                <span>参考图（2/5）</span>
                <div class="ms-refs-actions">
                  <button class="ms-text-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>上传</button>
                  <button class="ms-text-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>素材库</button>
                </div>
              </div>
              <div class="ms-drop">
                <div class="ms-ref">
                  <svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab6"/><stop offset="1" stop-color="#5b3fd6"/></linearGradient></defs><rect width="100" height="100" fill="url(#r1)"/><circle cx="50" cy="44" r="24" fill="#ffffff" opacity=".25"/><circle cx="50" cy="44" r="13" fill="#1b1036" opacity=".55"/></svg>
                </div>
                <div class="ms-ref">
                  <svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="r2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#132a4a"/><stop offset="1" stop-color="#17c2b0"/></linearGradient></defs><rect width="100" height="100" fill="url(#r2)"/><path d="M0 70L35 45l22 18 18-12 25 20v29H0Z" fill="#06121f" opacity=".6"/><circle cx="72" cy="26" r="9" fill="#f6f0c8" opacity=".8"/></svg>
                </div>
                <span class="ms-drop-hint">拖入图片，或使用上面的按钮</span>
              </div>
            </div>

            <div class="ms-submit-row">
              <button class="ms-btn primary md"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7L12 3Z"/></svg><span>生成 4 张</span></button>
              <span class="ms-hint">出图后点结果里的「作参考」可继续改</span>
            </div>
          </div>

          <aside class="ms-result">
            <div class="ms-result-head"><span>本次结果</span><button class="ms-text-btn">全部任务</button></div>
            <div class="ms-result-job">
              <div class="ms-job succeeded">
                <div class="ms-job-head">
                  <span class="ms-state succeeded">完成</span>
                  <span class="ms-job-kind">图像</span>
                  <span class="ms-job-channel">openai</span>
                  <span class="ms-job-time">刚刚</span>
                </div>
                <div class="ms-job-prompt">雨夜霓虹街头的一只赛博朋克猫，电影感光线，浅景深，35mm，背景有漂浮的全息广告牌</div>
                <div class="ms-job-assets">
                  <div class="ms-tile"><button class="ms-tile-main">
                    <div class="ms-thumb image">
                      <svg class="art" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b1055"/><stop offset=".5" stop-color="#7b2cbf"/><stop offset="1" stop-color="#ff4d9d"/></linearGradient></defs><rect width="120" height="120" fill="url(#a1)"/><rect x="0" y="78" width="120" height="42" fill="#0b0718" opacity=".65"/><rect x="10" y="20" width="26" height="52" rx="3" fill="#00e5ff" opacity=".28"/><rect x="84" y="14" width="24" height="64" rx="3" fill="#ff2d95" opacity=".3"/><ellipse cx="60" cy="82" rx="26" ry="7" fill="#000" opacity=".45"/><path d="M46 78c0-16 7-26 14-26s14 10 14 26Z" fill="#120a24"/><circle cx="54" cy="62" r="2.6" fill="#ffe96b"/><circle cx="66" cy="62" r="2.6" fill="#ffe96b"/><path d="M42 54l-6-14 12 8M78 54l6-14-12 8" fill="#120a24"/></svg>
                    </div>
                    <span class="ms-tile-meta"><span class="ms-tile-name">赛博朋克猫 · 雨夜霓虹</span><span class="ms-tile-sub">图片 · 2.4 MB · 1536×864</span></span>
                  </button></div>
                  <div class="ms-tile"><button class="ms-tile-main">
                    <div class="ms-thumb image">
                      <svg class="art" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061a2b"/><stop offset=".6" stop-color="#0f4c5c"/><stop offset="1" stop-color="#e36414"/></linearGradient></defs><rect width="120" height="120" fill="url(#a2)"/><circle cx="34" cy="34" r="22" fill="#ffd166" opacity=".25"/><rect x="0" y="72" width="120" height="48" fill="#04121c" opacity=".8"/><rect x="14" y="40" width="18" height="38" rx="2" fill="#48cae4" opacity=".28"/><rect x="88" y="34" width="18" height="44" rx="2" fill="#f72585" opacity=".26"/><path d="M54 76c0-14 5-22 11-22s11 8 11 22Z" fill="#0a1520"/><circle cx="61" cy="63" r="2" fill="#9ef01a"/><circle cx="69" cy="63" r="2" fill="#9ef01a"/></svg>
                    </div>
                    <span class="ms-tile-meta"><span class="ms-tile-name">赛博朋克猫 · 全息广告牌</span><span class="ms-tile-sub">图片 · 2.1 MB · 1536×864</span></span>
                  </button></div>
                </div>
                <div class="ms-result-hint"><span class="ms-tag ok">已存入素材库</span><span>D:/work/media-studio/2026/11/openai-1-….png</span></div>
              </div>
            </div>
            <div class="ms-recent" style="margin-top:12px">
              <button class="ms-recent-item"><div class="ms-thumb sm"><svg class="art" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="60" fill="#efe9ff"/><circle cx="30" cy="26" r="12" fill="#7b6cff" opacity=".5"/><rect x="8" y="42" width="44" height="8" rx="4" fill="#7b6cff" opacity=".25"/></svg></div></button>
              <button class="ms-recent-item"><div class="ms-thumb sm"><svg class="art" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="60" fill="#e6f7f2"/><path d="M0 46l18-18 12 12 9-8 21 18v10H0Z" fill="#2f9e7e" opacity=".5"/><circle cx="44" cy="16" r="6" fill="#f2c94c"/></svg></div></button>
              <button class="ms-recent-item"><div class="ms-thumb sm"><svg class="art" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="60" fill="#fff1e6"/><circle cx="30" cy="34" r="15" fill="#e07a5f" opacity=".45"/><rect x="12" y="8" width="36" height="8" rx="4" fill="#e07a5f" opacity=".25"/></svg></div></button>
              <button class="ms-recent-item"><div class="ms-thumb sm"><svg class="art" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="60" fill="#e8f0fe"/><rect x="10" y="10" width="18" height="40" rx="3" fill="#4c6ef5" opacity=".4"/><rect x="32" y="18" width="18" height="32" rx="3" fill="#4c6ef5" opacity=".22"/></svg></div></button>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="mock-note">dsh-media-studio · 界面预览（静态模拟）</div>
</body>
</html>
